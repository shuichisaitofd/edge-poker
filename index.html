<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#dbe7ff"><title>KABU TABLE v04</title><style>
*{box-sizing:border-box}body{margin:0;background:#dbe6f7;color:#15366d;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #fff08c;outline-offset:3px}.app{width:min(100%,650px);margin:auto;height:100dvh;min-height:560px;overflow:hidden;position:relative;background:radial-gradient(ellipse at 52% 10%,#fbfdff,#d2e1fc 75%)}.room{position:absolute;inset:0;background:linear-gradient(transparent 0 62%,#b9cff1 62%)}.header{position:absolute;z-index:5;top:max(12px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.logo{font-weight:1000;font-size:19px}.logo span{color:#5379e0}.bank{border-radius:20px;background:white;padding:9px 13px;font-size:12px;font-weight:800;box-shadow:0 5px 20px #5780b127}.bank b{font-size:17px;color:#3b68d2}.dealer-avatar{position:absolute;z-index:3;top:12%;left:50%;transform:translateX(-50%);text-align:center}.face{width:58px;height:58px;border-radius:50%;border:4px solid white;background:#ffc992;box-shadow:0 5px 15px #42689c4a;margin:auto;position:relative;overflow:hidden}.face:before{content:"";position:absolute;inset:-12px -5px auto;height:31px;border-radius:45%;background:#445777}.face:after{content:"•  •";position:absolute;top:21px;left:15px;color:#273950}.who{background:#3d65bc;color:white;font-size:11px;font-weight:900;border-radius:10px;padding:3px 9px;margin-top:4px}.table{position:absolute;left:-9%;width:118%;top:25%;height:64%;transform:perspective(850px) rotateX(17deg);background:linear-gradient(120deg,#2b58ad,#153b83);border-radius:48% 48% 39% 39%/36% 36% 28% 28%;padding:13px;box-shadow:0 19px 0 #153471,0 31px 29px #3c5c9377}.felt{position:relative;width:100%;height:100%;border-radius:inherit;background:radial-gradient(ellipse at 50% 30%,#5c80e7,#2e55b5 85%);border:3px solid #8caef2}.felt:before{content:"";position:absolute;inset:7%;border:2px solid #a4bcfa55;border-radius:inherit;pointer-events:none}.deck{position:absolute;left:9%;top:22%;border:0;background:none;padding:7px;z-index:5;transform:rotate(-11deg);transition:transform .2s}.deck .back{box-shadow:0 4px #1a428c,0 8px #a4c4f6,0 12px #1a428c}.deck.ready{animation:beacon 1.5s infinite}.deck.ready:active{transform:rotate(-11deg) scale(.93)}@keyframes beacon{50%{filter:drop-shadow(0 0 13px #fff68c)}}.deck-label{font-size:11px;color:#f0f6ff;font-weight:950;display:block;margin-top:12px;transform:rotate(11deg);white-space:nowrap}.dealer-cards{position:absolute;z-index:3;top:10%;left:50%;transform:translateX(-50%);display:flex;gap:5px;min-height:67px;align-items:center}.lanes{position:absolute;top:47%;left:3%;width:94%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px}.lane{border:2px solid transparent;background:transparent;border-radius:13px;padding:8px 1px;min-height:138px;color:#ecf4ff;display:flex;align-items:center;flex-direction:column;gap:6px;transition:transform .2s,background .2s;position:relative}.lane.pick{animation:beacon 1.7s infinite}.lane.selected{border-color:#ffdc7f;background:#ffffff22;transform:translateY(-13px)}.lane-name{font-weight:900;font-size:11px}.lane-cards{min-height:71px;display:flex;justify-content:center;align-items:flex-start}.lane-cards>.card:not(:first-child){margin-left:-23px;transform:translateY(7px)}.card{width:45px;height:67px;border-radius:7px;background:#fff;color:#1a324a;position:relative;flex:none;border:1px solid #d3e0f1;box-shadow:0 4px 3px #102d7a60;display:grid;place-items:center;font:29px Georgia,serif}.card.red{color:#e24b59}.card small{position:absolute;top:3px;left:4px;font:900 13px system-ui}.card.back{background:repeating-linear-gradient(45deg,#5682e4 0 5px,#8cadf7 5px 10px);border:4px solid #fff}.lane-score{background:white;color:#315cbe;border-radius:20px;padding:4px 8px;font-size:14px;font-weight:1000;box-shadow:0 4px 10px #15377170}.score-dealer{position:absolute;left:50%;top:31%;transform:translateX(-50%);z-index:5;background:#fff;color:#305bbb;border-radius:30px;padding:5px 11px;font-weight:1000;font-size:17px}.chip-marker{position:absolute;top:94%;left:50%;transform:translateX(-50%);border:3px dashed #ffe7ac;border-radius:50%;width:40px;height:40px;background:#e4a63e;color:#fff;display:grid;place-items:center;font-weight:1000;font-size:11px;box-shadow:0 4px #a87327}.floating{position:absolute;z-index:9;left:50%;transform:translateX(-50%);display:flex;gap:8px;justify-content:center;align-items:center;max-width:98%;width:max-content}.bet-choices{top:70%;}.chip-btn{border:4px dashed #fff;width:54px;height:54px;border-radius:50%;background:#4d78d8;color:white;font-size:14px;font-weight:1000;box-shadow:0 5px 0 #264da6}.chip-btn:nth-child(2){background:#e2af3d;box-shadow:0 5px 0 #956722}.chip-btn:nth-child(3){background:#d65d73;box-shadow:0 5px 0 #9c394d}.chip-btn:nth-child(4){background:#4b5783;box-shadow:0 5px 0 #313957}.chip-btn:active{transform:translateY(3px)}.decision{top:76%;width:88%}.action{border:2px solid #e2eaff;padding:13px 10px;border-radius:12px;min-width:100px;min-height:51px;background:#fff;color:#3159b3;font-weight:950;box-shadow:0 5px 8px #18346f59}.action.blue{background:#f8cb4e;color:#403418;border-color:#ffe79d}.action:active{transform:translateY(3px)}.message{position:absolute;z-index:8;bottom:7%;left:50%;transform:translateX(-50%);background:#ffffffea;color:#355eb7;border-radius:17px;padding:10px 16px;font-weight:900;font-size:12px;text-align:center;white-space:nowrap;max-width:92%;box-shadow:0 5px 13px #163a8145;pointer-events:none}.outcome{position:absolute;z-index:11;top:52%;left:50%;transform:translate(-50%,-50%);text-align:center;background:#fffffff2;border:3px solid #f8da80;padding:20px 14px;border-radius:22px;width:80%;box-shadow:0 14px 32px #142f7a8a;animation:pop .35s backwards}.outcome h2{margin:0;font-size:30px;color:#275ab3}.outcome p{font-size:16px;font-weight:900;margin:8px 0}.outcome .gain{color:#219472;font-weight:1000}.outcome button{background:#4973df;border:0;color:white;font-weight:900;border-radius:12px;padding:12px 25px;margin-top:10px}@keyframes pop{from{opacity:0;transform:translate(-50%,-45%) scale(.75)}}.flying{position:fixed;z-index:50;pointer-events:none;transition:left .34s cubic-bezier(.2,.7,.2,1),top .34s cubic-bezier(.2,.7,.2,1),transform .34s}.flip{perspective:650px}.flip-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s}.flip.flipped .flip-inner{transform:rotateY(180deg)}.flip-front,.flip-back{position:absolute;inset:0;backface-visibility:hidden}.flip-front{transform:rotateY(180deg)}.flip-back.card{width:100%;height:100%}.flip-front.card{width:100%;height:100%}.hidden{display:none!important}.reset{position:absolute;bottom:max(10px,env(safe-area-inset-bottom));right:12px;border:0;background:#ffffff9e;color:#5271a2;font-size:11px;border-radius:12px;padding:7px 10px;z-index:4}@media(max-width:390px){.table{left:-15%;width:130%;top:27%;height:61%}.lanes{top:44%}.card{width:39px;height:60px;font-size:26px}.lane-cards>.card:not(:first-child){margin-left:-21px}.lane{min-height:124px}.floating.bet-choices{top:70%}.cancel-field{position:absolute;z-index:12;top:81%;left:50%;transform:translateX(-50%);background:#f5f8ff;color:#355cab;border:2px solid #bed0f5;padding:10px 18px;min-height:43px;border-radius:14px;font-weight:900;box-shadow:0 3px 12px #12357960}.cancel-field[hidden]{display:none}.bet-confirm{position:absolute;z-index:12;top:70%;left:50%;transform:translateX(-50%);display:flex;gap:9px;width:90%;justify-content:center}.bet-confirm[hidden]{display:none}.bet-confirm button{border:0;border-radius:13px;min-height:52px;padding:0 18px;font-weight:950;background:#fff;color:#3159b3}.bet-confirm button:last-child{background:#f8cb4e;color:#403418}.chip-btn{width:47px;height:47px;font-size:12px}}@media(max-height:690px){.dealer-avatar{top:10%}.table{top:23%;height:67%}.message{bottom:5%}}
.bet-place{position:absolute;z-index:14;left:50%;top:83%;transform:translateX(-50%);border:2px solid #fff4bc;background:#ffcf59;color:#46340e;border-radius:50px;padding:12px 20px;min-height:48px;box-shadow:0 5px 0 #b88520;font-weight:1000;white-space:nowrap}.bet-place[hidden]{display:none}.chip-btn.active{outline:3px solid #fff1a6;transform:translateY(-5px)}.lane.preview .chip-marker{background:#ffcf59;color:#4d3915;border-color:#fff1bc}</style></head><body><div class="app"><div class="room"></div><div class="header"><div class="logo">KABU <span>TABLE</span></div><div class="bank">チップ <b id="balance">1,000</b></div></div><div class="dealer-avatar"><div class="face"></div><div class="who">親 · CPU</div></div><div class="table"><div class="felt"><button class="deck ready" id="deck" aria-label="山札をタップして配る"><div class="card back"></div><span class="deck-label" id="deckLabel">タップして配る</span></button><div class="dealer-cards" id="dealer"></div><div class="score-dealer hidden" id="dealerScore"></div><div class="lanes" id="lanes"></div><div class="floating bet-choices hidden" id="betChoices"></div><div class="floating decision hidden" id="decision"></div><button class="bet-place" id="betPlace" hidden>BETを確定</button><div class="message" id="hint">山札をタップしてスタート</div><div class="outcome hidden" id="outcome"></div></div></div><button class="reset" id="reset">リセット</button></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),su=['♠','♥','♦','♣'],red=s=>s===1||s===2,wait=ms=>new Promise(r=>setTimeout(r,ms));let state='idle',busy=false,epoch=0,deck=[],lanes=[[],[],[],[]],dealer=[],selected=-1,bet=0,pendingBet=0,balance=1000,turn=1,revealed=0;const choices=[10,50,100,500];function shuffle(){deck=[];for(let s=0;s<4;s++)for(let n=1;n<=10;n++)deck.push({n,s});for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}}function draw(){return deck.pop()}function rank(n){return n===1?'A':n}function total(cs){return cs.reduce((a,c)=>a+c.n,0)%10}function role(cs,isDealer){let nums=cs.map(c=>c.n);if(cs.length===2){if(isDealer&&nums.includes(1)&&nums.includes(9))return{type:'kuppin',name:'クッピン',mult:1};if(!isDealer&&nums.includes(1)&&nums.includes(4))return{type:'mippin',name:'ミッピン',mult:3}}if(cs.length===3){if(nums.every(x=>x===nums[0]))return{type:'arashi',name:'嵐',mult:[1,3,5,10].includes(nums[0])?10:5};let s=[...cs].sort((a,b)=>a.n-b.n);if(s.every(x=>x.s===s[0].s)&&s[1].n===s[0].n+1&&s[2].n===s[1].n+1)return{type:'shuntsu',name:'順子',mult:5}}return{type:'normal',name:total(cs)+'点',mult:1}}
function card(c,covered=false){let e=document.createElement('div');e.className='card'+(covered?' back':red(c.s)?' red':'');if(!covered)e.innerHTML='<small>'+rank(c.n)+'</small>'+su[c.s];return e}function flipCard(c){let outer=document.createElement('div');outer.className='card flip';let inside=document.createElement('div');inside.className='flip-inner';let back=document.createElement('div');back.className='card back flip-back';let front=card(c);front.classList.add('flip-front');inside.append(back,front);outer.append(inside);return outer}function hint(t){$('hint').textContent=t;$('hint').classList.toggle('hidden',!t)}function render(){ $('balance').textContent=balance.toLocaleString();$('dealer').replaceChildren();dealer.forEach((c,i)=>{let e=flipCard(c);if(i<revealed)e.classList.add('flipped');$('dealer').append(e)});$('dealerScore').classList.toggle('hidden',revealed===0);if(revealed)$('dealerScore').textContent='親 '+total(dealer.slice(0,revealed))+'点';$('lanes').replaceChildren();lanes.forEach((cards,i)=>{let b=document.createElement('button');b.className='lane'+(selected===i?' selected':'')+(['pick','bet'].includes(state)?' pick':'');b.disabled=busy||!['pick','bet'].includes(state);b.innerHTML='<span class="lane-name">場 '+(i+1)+'</span><div class="lane-cards"></div>';let holder=b.querySelector('.lane-cards');cards.forEach(c=>holder.append(card(c)));if(selected===i&&cards.length>=2){let s=document.createElement('div');s.className='lane-score';s.textContent=total(cards)+'点';b.append(s)}if(i===selected&&(bet||pendingBet)){let ch=document.createElement('div');ch.className='chip-marker';ch.textContent=bet||pendingBet;b.append(ch)}b.onclick=()=>select(i);$('lanes').append(b)});$('deck').classList.toggle('ready',state==='idle');$('deckLabel').textContent=state==='idle'?'タップして配る':'山札';$('deck').disabled=state!=='idle'||busy;$('betChoices').classList.toggle('hidden',state!=='bet');$('decision').classList.toggle('hidden',state!=='decide');$('betPlace').hidden=state!=='bet'||!pendingBet;$('betPlace').textContent=pendingBet?'BET '+pendingBet+' を確定':'';document.querySelectorAll('#betChoices .chip-btn').forEach(e=>e.classList.toggle('active',Number(e.textContent)===pendingBet))}
function coords(el){let r=el.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2}}async function fly(target,c,covered=false){let src=coords($('deck')),dst=coords(target),f=card(c,covered);f.classList.add('flying');f.style.left=(src.x-22)+'px';f.style.top=(src.y-33)+'px';document.body.append(f);await wait(24);f.style.left=(dst.x-22)+'px';f.style.top=(dst.y-33)+'px';f.style.transform='rotate(7deg)';await wait(390);f.remove()}
async function addToLane(i){const c=draw();let target=$('lanes').children[i].querySelector('.lane-cards');await fly(target,c,true);lanes[i].push(c);render();await wait(135)}async function addDealer(){const c=draw();let t=$('dealer');await fly(t,c,true);dealer.push(c);render();await wait(135)}async function start(){if(state!=='idle'||busy)return;const id=++epoch;busy=true;state='deal';shuffle();lanes=[[],[],[],[]];dealer=[];selected=-1;bet=0;pendingBet=0;revealed=0;render();hint('カードを配っています…');for(let i=0;i<4;i++){await addToLane(i);if(id!==epoch)return}await addDealer();if(id!==epoch)return;busy=false;state='pick';render();hint('光っている札から1枚タップ')}
function select(i){if(!['pick','bet'].includes(state)||busy)return;if(state==='pick'){selected=i;state='bet';pendingBet=0;buildChips();render();hint('チップを選択。別の札もタップできます');return}if(selected===i){selected=-1;pendingBet=0;state='pick';render();hint('場の札をタップして選択');return}selected=i;render();hint('賭け先を変更しました')}function buildChips(){$('betChoices').replaceChildren();choices.filter(v=>v<=balance).forEach(v=>{let b=document.createElement('button');b.className='chip-btn';b.textContent=v;b.onclick=()=>placeBet(v);$('betChoices').append(b)})}function placeBet(v){if(state!=='bet'||busy||v>balance)return;pendingBet=v;render();hint('金額や札は変更できます。確定で配札します')}async function confirmBet(){if(state!=='bet'||busy||!pendingBet||selected<0)return;const id=epoch;busy=true;bet=pendingBet;pendingBet=0;balance-=bet;state='deal2';render();hint('2枚目を配っています…');await wait(250);for(let i=0;i<4;i++){await addToLane(i);if(id!==epoch)return}await addDealer();if(id!==epoch)return;busy=false;state='decide';render();hint('この点数で勝負？ もう1枚引く？');$('decision').innerHTML='';let stand=document.createElement('button'),hit=document.createElement('button');stand.className='action';stand.textContent='この点数で勝負';hit.className='action blue';hit.textContent='もう1枚引く';stand.onclick=()=>finish(false);hit.onclick=()=>finish(true);$('decision').append(stand,hit)}async function finish(hit){if(busy||state!=='decide')return;const id=epoch;busy=true;state='resolve';render();$('decision').classList.add('hidden');if(hit){hint('選んだ札に3枚目を配ります…');await addToLane(selected)}if(id!==epoch)return;hint('親の札を1枚ずつ公開');const dRole=role(dealer,true);if(dRole.type!=='kuppin'&&total(dealer)<=5&&dealer.length<3)await addDealer();if(id!==epoch)return;for(let i=0;i<dealer.length;i++){revealed=i+1;let flipping=$('dealer').children[i];if(flipping)flipping.classList.add('flipped');$('dealerScore').classList.remove('hidden');$('dealerScore').textContent='親 '+total(dealer.slice(0,revealed))+'点';await wait(730)}if(id!==epoch)return;let p=role(lanes[selected],false),d=role(dealer,true),ps=total(lanes[selected]),ds=total(dealer),win=false,tie=false;if(d.type==='kuppin')win=false;else if(['mippin','arashi','shuntsu'].includes(p.type))win=true;else if(['arashi','shuntsu'].includes(d.type))win=false;else if(ps===ds)tie=true;else win=ps>ds;let gain=win?bet*p.mult:0;balance+=win?bet+gain:tie?bet:0;state='result';busy=false;render();hint('');let o=$('outcome');o.classList.remove('hidden');o.innerHTML='<h2>'+(tie?'引き分け':win?'あなたの勝ち！':'親の勝ち')+'</h2><p>あなた '+ps+'点　対　親 '+ds+'点</p><div class="gain">'+(tie?'賭け点を返却':win?'+'+gain+' チップ':'−'+bet+' チップ')+'</div><button id="next">次のゲームへ</button>';o.querySelector('#next').onclick=next}
function next(){if(state!=='result')return;turn++;state='idle';busy=false;selected=-1;bet=0;pendingBet=0;revealed=0;dealer=[];lanes=[[],[],[],[]];$('outcome').classList.add('hidden');if(balance<10)balance=1000;render();hint('山札をタップしてスタート')}
$('betPlace').onclick=confirmBet;$('deck').onclick=start;$('reset').onclick=()=>{epoch++;state='idle';busy=false;balance=1000;turn=1;selected=-1;bet=0;pendingBet=0;revealed=0;lanes=[[],[],[],[]];dealer=[];document.querySelectorAll('.flying').forEach(e=>e.remove());$('outcome').classList.add('hidden');render();hint('山札をタップしてスタート')};render();})();
</script></body></html>
