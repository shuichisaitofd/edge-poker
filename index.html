<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a2118">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>旅館カブ</title>
<link rel="preload" as="image" href="assets/bg.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Dela+Gothic+One&family=Noto+Sans+JP:wght@500;700;900&family=Yuji+Syuku&family=Yuji+Boku&display=swap">
<script>if(/[?&](seed|test)=/.test(location.search)&&!/[?&]title=1/.test(location.search))document.documentElement.classList.add("skip-title")</script>
<link rel="preload" as="image" href="assets/title.webp">
<link rel="prefetch" as="image" href="assets/end-bad.webp">
<link rel="prefetch" as="image" href="assets/end-good.webp">
<link rel="stylesheet" href="css/style.css?v=20261019n">
</head>
<body>
<main class="app" id="app">
  <div class="field" id="field" data-stage="idle">

    <div class="topbar">
      <button class="tag score-tag" id="scoreBtn" type="button" aria-label="戦績を見る"><svg class="sc-ico" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="9" width="3.4" height="6"/><rect x="6.3" y="5" width="3.4" height="10"/><rect x="11.6" y="1" width="3.4" height="14"/></svg>SCORE <b id="scoreVal">0</b><span class="sc-open">戦績 ›</span></button>
      <button class="sound" id="sound" type="button" aria-label="効果音 オン/オフ" aria-pressed="false"></button>
    </div>

    <div class="items" id="items" data-count="0" hidden></div>

    <div class="sp1"></div>

    <section class="zone zone-dealer" aria-label="あき(親)">
      <span class="tag tag-dealer" id="bossTag">あき</span>
      <div class="dealer-hand" id="dealerHand"></div>
      <span class="tag tag-score off" id="dealerScore"></span>
      <button class="deck" id="deck" type="button" aria-label="山札をタップして配る">
        <span class="deck-stack"></span>
        <span class="tag tag-deck" id="deckTag">残り 40枚</span>
      </button>
    </section>

    <section class="zone zone-mid" aria-live="polite">
      <div class="swap-hint" id="swapHint" hidden>乗り換える隣の場を選んでください</div>
      <div class="start-hint" id="startHint">画面をタップで配る</div>
      <div class="verdict off" id="verdict">
        <strong id="verdictTitle"></strong>
        <span id="verdictSub"></span>
      </div>
    </section>

    <section class="zone zone-lanes" id="lanes" aria-label="場札"></section>

    <div class="sp2"></div>

    <section class="zone zone-bank">
      <div class="purse" id="purse">持ち金 <strong id="purseAmount">2,500</strong>円<span class="fx-notes" id="fxNotes"></span></div>
    </section>

    <section class="zone zone-coins" id="coins" aria-label="賭け金の硬貨"></section>

    <section class="zone zone-slot">
      <div class="slot" id="slot" data-mode="none">
        <button class="slot-btn" id="slotBtn" type="button" disabled></button>
        <div class="slot-pair" id="slotPair">
          <button class="slot-btn slot-main" id="standBtn" type="button">この点数で勝負</button>
          <button class="slot-btn slot-sub" id="hitBtn" type="button">もう1枚引く</button>
        </div>
      </div>
    </section>

    <div class="omen" id="omen" aria-hidden="true"><span class="omen-l"></span><span class="omen-r"></span><span class="omen-c"></span></div>
    <div class="itemask" id="itemAsk" hidden aria-hidden="true">
      <div class="ifx-dim"></div>
      <div class="ask-card" role="dialog" aria-label="アイテムを使いますか">
        <span class="ask-img" id="askImg"></span>
        <h3 id="askName"></h3>
        <p class="ifx-desc" id="askDesc"></p>
        <p class="ask-note">使うと、このアイテムはなくなります</p>
        <div class="ask-btns"><button type="button" class="ask-btn use" id="askUse">使う</button><button type="button" class="ask-btn" id="askCancel">やめる</button></div>
      </div>
    </div>
    <div class="itemfx" id="itemfx" hidden aria-hidden="true">
      <div class="ifx-dim"></div>
      <p class="ifx-title" id="ifxTitle" hidden></p>
      <div class="ifx-reel" id="ifxReel" hidden><span class="ifx-ico"></span><b></b></div>
      <div class="ifx-bike" id="ifxBike" hidden><img src="assets/item-bike.webp" alt="" draggable="false"></div>
      <div class="ifx-drop" id="ifxDrop" hidden></div>
      <div class="ifx-reveal" id="ifxReveal" hidden>
        <div class="ifx-halo"></div>
        <div class="ifx-card"><span class="ifx-icon" id="ifxIcon"></span><h3 id="ifxName"></h3><p class="ifx-desc" id="ifxDesc"></p><p class="ifx-when" id="ifxWhen"></p></div>
        <span class="ifx-tap">タップで閉じる</span>
      </div>
    </div>
    <div class="cutin" id="cutin" data-kind="win" aria-hidden="true"><div class="cutin-lines"></div><div class="cutin-band"><span id="cutinText"></span><small id="cutinSub"></small></div></div>
    <div class="stats" id="stats" hidden>
      <div class="stats-sheet" role="dialog" aria-label="戦績">
        <h2>戦績</h2>
        <dl id="statsList"></dl>
        <div class="stats-actions">
          <button type="button" class="stats-reset" id="resetRun">最初からやり直す</button>
          <button type="button" class="stats-reset" id="resetStats">戦績を消す</button>
        </div>
        <button type="button" class="stats-close" id="statsClose">とじる</button>
      </div>
    </div>
  </div>

  <!-- スタート画面 → ロード(あらすじ)画面 -->
  <div class="title" id="title" data-phase="start">
    <div class="title-shade"></div>
    <div class="title-head">
      <h1 class="title-logo">あきの忘れた<br>4000円を奪え。</h1>
      <p class="title-sub">Win Aki's forgotten 4000 yen — at Kabu</p>
    </div>
    <div class="title-actions" id="titleActions">
      <button class="title-btn" id="titleBtn" type="button">あきから4000円を奪う</button>
      <button class="title-btn" id="titleContinue" type="button" hidden>続きから</button>
      <p class="title-save" id="titleSave" hidden></p>
      <button class="title-btn title-btn-sub" id="titleNew" type="button" hidden>最初から</button>
    </div>
    <div class="loading" id="loading" aria-live="polite">
      <p class="load-main">あきがガソスタに忘れた<br><em>4000円</em>を奪え</p>
      <ol class="load-lines" id="loadLines">
        <li>場の札を1枚選んで、金額を賭ける</li>
        <li>あきより点が高ければ勝ち</li>
        <li>あきの持ち金を<b>0</b>にすればクリア</li>
        <li>持ち金は2,500円。尽きたら負け</li>
      </ol>
      <div class="load-bar"><i id="loadBar"></i></div>
      <p class="load-tap">タップでスキップ</p>
    </div>
  </div>

  <!-- BAD END(持ち金が尽きた翌日)/ GOOD END(あきを倒した翌日) -->
  <div class="badend" id="badend" data-kind="bad" hidden aria-live="polite">
    <p class="be-day" id="beDay">次の日</p>
    <img class="be-full" id="beImg" src="assets/end-bad.webp" alt="スマホで見返す、あの日の写真" draggable="false">
    <div class="be-shade"></div>
    <p class="be-cap" id="beCap"></p>
    <p class="be-stamp" id="beStamp">BAD END</p>
    <button class="title-btn be-btn" id="beBtn" type="button">もう一度あきに挑む</button>
  </div>
</main>
<noscript><p style="color:#fff;text-align:center">JavaScriptを有効にしてください。</p></noscript>
<script src="js/rules.js?v=20261019n"></script>
<script src="js/cards.js?v=20261019n"></script>
<script src="js/audio.js?v=20261019n"></script>
<script src="js/fx.js?v=20261019n"></script>
<script src="js/items.js?v=20261019n"></script>
<script src="js/game.js?v=20261019n"></script>
<script src="js/title.js?v=20261019n"></script>
</body>
</html>
