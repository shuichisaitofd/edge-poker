<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#e9eef8">
<title>KABU TABLE Animated Prototype</title>
<style>
:root{font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;color:#233350;font-synthesis:none}
*{box-sizing:border-box}
body{margin:0;background:#dbe4f4}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid #f7c64e;outline-offset:3px}
.app{max-width:520px;margin:auto;min-height:100dvh;background:#eff3fb;display:flex;flex-direction:column;overflow:hidden}
.head{height:59px;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 19px;box-shadow:0 2px 12px #36548a12;z-index:1}
.brand{font-size:19px;font-weight:1000;letter-spacing:-.06em}.brand em{color:#5173df;font-style:normal}
.meta{font-size:11px;color:#7f8fac;font-weight:750}.balance{font-size:13px;background:#edf2fe;padding:9px 12px;border-radius:30px;font-weight:900}.balance span{color:#4674df}
.play{position:relative;min-height:450px;height:min(60dvh,565px);overflow:hidden;background:radial-gradient(ellipse at 45% 15%,#f8fbff 8%,#d9e6f9 79%,#bccfe9)}
.light{position:absolute;inset:0;background:linear-gradient(120deg,#fff6 0 10%,transparent 29%),repeating-linear-gradient(90deg,transparent 0 54px,#ffffff24 55px 57px)}
.room-floor{position:absolute;inset:56% 0 0;background:linear-gradient(#dee8f7,#bdcde4)}
.cpu{position:absolute;z-index:3;top:23px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px}
.avatar{width:52px;height:52px;border-radius:50%;background:#f6bf8b;border:4px solid white;box-shadow:0 4px 8px #3d5f9140;position:relative;overflow:hidden}.avatar:before{content:"";position:absolute;left:-5px;top:-10px;width:62px;height:29px;border-radius:50%;background:#3c4e70}.avatar:after{content:"••";position:absolute;top:18px;left:12px;letter-spacing:7px;color:#3b4b66}.cpu b{font-size:11px;background:#395cb0;border-radius:30px;color:white;padding:4px 12px}
.table-shell{position:absolute;top:26%;left:50%;width:116%;height:65%;transform:translateX(-50%) perspective(750px) rotateX(30deg);border-radius:49% 49% 39% 39%/37% 37% 32% 32%;padding:14px;background:linear-gradient(140deg,#315ba8,#163d82);box-shadow:0 15px 0 #17346f,0 25px 24px #2b4a8073}
.felt{position:relative;width:100%;height:100%;border:2px solid #a1baf4;border-radius:inherit;background:radial-gradient(ellipse at 50% 25%,#597ce4,#375dbd 65%,#264c9d)}.felt:before{content:"";position:absolute;inset:8%;border:2px solid #b0c6ff65;border-radius:inherit}
.deck{position:absolute;left:10%;top:14%;width:36px;height:53px;border-radius:5px;background:repeating-linear-gradient(45deg,#557de2 0 4px,#7396f0 4px 8px);border:4px solid #fff;box-shadow:0 4px 0 #1c4293,0 7px 0 #dfe8fa;transform:rotate(-14deg);z-index:2}
.dealer{position:absolute;left:50%;top:7%;transform:translateX(-50%);display:flex;gap:6px;min-width:108px;justify-content:center}
.card,.flip-card{position:relative;flex-shrink:0;width:49px;height:72px}
.card-face,.flip-inner .front,.flip-inner .back{position:absolute;inset:0;border-radius:7px;display:flex;align-items:center;justify-content:center}
.card-face,.flip-inner .front{background:#fff;border:1px solid #dce4f2;color:#26304a;box-shadow:0 4px 3px #1635726b;font:33px Georgia,serif}
.card-face.red,.flip-inner .front.red{color:#dc4556}
.card-face small,.flip-inner .front small{position:absolute;top:4px;left:5px;font:800 13px system-ui}
.card.back,.flip-inner .back{background:repeating-linear-gradient(45deg,#5379dd 0 5px,#7297ef 5px 10px);border:4px solid white;box-shadow:0 4px 3px #1635726b}
.flip-card{perspective:700px}.flip-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s ease}.flip-card.revealed .flip-inner{transform:rotateY(180deg)}.flip-inner .front,.flip-inner .back{backface-visibility:hidden}.flip-inner .front{transform:rotateY(180deg)}
.lane-row{position:absolute;left:5%;right:5%;top:49%;display:flex;justify-content:space-around;gap:1px}
.lane{min-width:0;width:24%;border:2px solid transparent;border-radius:13px;background:none;padding:7px 0;display:flex;flex-direction:column;align-items:center;gap:7px;color:#d7e4ff;transition:.25s;cursor:pointer;position:relative}
.lane .cards{height:78px;display:flex;justify-content:center;align-items:flex-start;position:relative}.lane .cards > *:not(:first-child){margin-left:-24px;transform:translateY(6px)}
.lane label{font-weight:900;font-size:11px;pointer-events:none}.lane.active{border-color:#ffeb94;background:#ffec841c;transform:translateY(-7px)}.lane.active .cards > *:first-child{transform:translateY(-12px);box-shadow:0 11px 14px #0f2d7599,0 0 0 3px #ffe18f}.lane.active label{color:#ffeb8d}
.lane.selectable:not(.active){animation:glow 1.9s infinite}.lane.disabled{pointer-events:none;opacity:.82}
@keyframes glow{50%{background:#ffffff24}}
.lane .score{font-size:12px;color:#f9e5a3;font-weight:900;min-height:18px}
.tap-hint{position:absolute;left:50%;bottom:13%;transform:translateX(-50%);background:#ffffffee;padding:8px 13px;border-radius:100px;color:#335cba;font-weight:900;font-size:12px;white-space:nowrap;z-index:5;box-shadow:0 5px 16px #11377740}
.table-pot{position:absolute;bottom:6%;left:49%;transform:translateX(-50%);background:#143c86e6;border:1px solid #c0cfff7c;color:#fff;border-radius:13px;padding:6px 18px;text-align:center;font-weight:1000;font-size:19px;min-width:84px}.table-pot small{display:block;font-weight:650;font-size:10px;color:#b4cdfb}
.coin{position:absolute;z-index:4;bottom:23%;left:41%;width:36px;height:12px;border-radius:50%;border:3px solid #ffeab2;background:#f5b641;box-shadow:0 4px #bd7e25,0 8px #ffd577,0 12px #bc7e29;transform:rotate(-20deg);opacity:0;transition:opacity .2s, left .35s ease, bottom .35s ease}
.lower{padding:13px 15px 20px;display:flex;flex-direction:column;gap:12px;flex:1}
.heading{display:flex;align-items:center;gap:8px}.round{font-size:11px;background:#dbe8ff;color:#3b64ba;border-radius:6px;font-weight:900;padding:6px 9px}.stage{font-size:12px;color:#7c90b1;font-weight:800}
.statement{font-size:21px;font-weight:1000;letter-spacing:-.04em;min-height:30px}.desc{font-size:12px;color:#6f809e;line-height:1.6;margin:0;min-height:38px}
.panel{background:#fff;border-radius:18px;padding:16px;box-shadow:0 6px 23px #4368ac12;min-height:130px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.actions{display:flex;gap:10px}.actions button{min-height:56px;border:0;border-radius:14px;font-weight:900;font-size:15px;flex:1}.primary{background:#4973df;color:#fff;box-shadow:0 4px 0 #3154b2}.secondary{background:#e3edff;color:#3d61ad}.ghost-btn{background:#fff;color:#4968ad;border:1px solid #c9d7f1}
.chip-row{display:flex;gap:9px;justify-content:space-between;align-items:center}.chip-btn{height:54px;width:54px;border-radius:50%;font-size:14px;font-weight:1000;border:6px dashed #fff;background:#5e84dd;color:white;box-shadow:0 2px 0 #3854a9;position:relative}.chip-btn.active{outline:3px solid #f2bc3d;transform:translateY(-5px)}.chip-btn:nth-child(2){background:#e0a843}.chip-btn:nth-child(3){background:#d55b6e}.chip-btn:nth-child(4){background:#515f80}
.results{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:center}.results div{padding:12px;background:#eaf1ff;border-radius:13px;font-weight:900}.results strong{display:block;font-size:30px;color:#3d69d6}.result-title{font-size:21px;font-weight:1000;color:#2b9f79}
.footer{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#8291aa;font-size:11px}.preview{border:0;background:transparent;color:#4a71be;font-weight:900;text-decoration:underline;padding:5px}.status{font-size:11px;text-align:center;color:#7788a5}
.hidden{display:none!important}
.flying{position:fixed;z-index:999;pointer-events:none;transition:transform .38s ease, left .38s ease, top .38s ease, opacity .2s ease}
.flash{animation:flash .45s ease}@keyframes flash{50%{filter:brightness(1.25) drop-shadow(0 0 12px #fff5b6)}}
.bounce{animation:bounce .42s ease}@keyframes bounce{0%{transform:translateY(0)}50%{transform:translateY(-10px)}100%{transform:translateY(0)}}
@media(max-width:380px){.play{min-height:420px;height:56dvh}.table-shell{width:125%;height:67%}.card,.flip-card{width:41px;height:61px}.card-face,.flip-inner .front{font-size:27px}.lane .cards{height:66px}.lane .cards > *:not(:first-child){margin-left:-21px}.chip-btn{width:47px;height:47px;font-size:12px}.statement{font-size:19px}}

.board-dealer-score{position:absolute;z-index:8;top:105px;left:50%;transform:translateX(-50%);background:#fff;color:#3155a7;border:2px solid #9bbafa;padding:7px 16px;border-radius:30px;font-weight:1000;font-size:18px;box-shadow:0 5px 15px #253e7e50;white-space:nowrap}
.board-dealer-score[hidden],.board-outcome[hidden]{display:none}
.board-outcome{position:absolute;z-index:11;top:43%;left:50%;transform:translate(-50%,-50%);width:min(88%,370px);padding:16px 12px;text-align:center;background:#fffffff5;border:3px solid #ffdd79;border-radius:18px;box-shadow:0 15px 35px #112d7773;animation:resultpop .45s cubic-bezier(.2,1.5,.4,1) both}
.board-outcome strong{display:block;font-size:31px;color:#1f4795;letter-spacing:-.04em}
.board-outcome .score-line{font-size:17px;font-weight:900;margin-top:6px}
.board-outcome .result-sub{font-size:12px;color:#58729b;margin-top:6px}
@keyframes resultpop{from{opacity:0;transform:translate(-50%,-40%) scale(.7)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.lane .score{min-height:23px;display:grid;place-items:center;border-radius:20px;padding:2px 5px}
.lane.active .score:not(:empty){background:#fff;color:#2554b6!important;border:2px solid #fdd968;font-size:17px;min-width:50px;box-shadow:0 4px 10px #0a2c8059}
.lane:not(.active) .score{font-size:10px;color:#c9d8ff}
.board-message{position:absolute;z-index:8;bottom:8%;left:50%;transform:translateX(-50%);padding:7px 12px;border-radius:20px;background:#ffffffeb;color:#375bb1;font-weight:900;font-size:12px;white-space:nowrap;max-width:90%;text-align:center}
.board-message[hidden]{display:none}
</style>
</head>
<body>
<div class="app">
  <header class="head">
    <div>
      <div class="brand">KABU <em>TABLE</em></div>
      <div class="meta">ANIMATED PROTOTYPE · v02</div>
    </div>
    <div class="balance">チップ <span id="balance">1,000</span></div>
  </header>
  <main>
    <section class="play" id="play">
      <div class="light"></div>
      <div class="room-floor"></div>
      <div class="cpu"><div class="avatar"></div><b>親 · CPU</b></div>
      <div class="table-shell">
        <div class="felt">
          <div class="deck" id="deck"></div>
          <div class="dealer" id="dealer"></div>
          <div class="lane-row" id="laneRow"></div>
          <div class="coin" id="coin"></div>
          <div class="table-pot"><small>BET</small><span id="pot">0</span></div>
        </div>
      </div>
      <div class="board-dealer-score" id="dealerScore" hidden></div><div class="board-outcome" id="boardOutcome" hidden></div><div class="board-message" id="boardMessage" hidden></div><div class="tap-hint hidden" id="hint">場のカードを選択</div>
    </section>
    <div class="lower">
      <section class="panel">
        <div class="heading"><span class="round" id="round">ROUND 01</span><span class="stage" id="stage">スタート</span></div>
        <div class="statement" id="statement">カードを配って開始します</div>
        <p class="desc" id="desc">山札から1枚ずつ配られます。配り終わると、賭けたい札を選べます。</p>
        <div class="results hidden" id="results"></div>
      </section>
      <div class="chip-row hidden" id="chips"></div>
      <div class="actions" id="actions"></div>
      <div class="footer"><span>配る・引く・めくる演出入り試作</span><button class="preview" id="restart">最初から</button></div>
      <div class="status">まだ試作です。配札・ドロー・親の公開の流れを確認するためのバージョンです。</div>
    </div>
  </main>
</div>
<script>
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const suits=['♠','♥','♦','♣'];
const red=s=>s===1||s===2;
const delay=ms=>new Promise(r=>setTimeout(r,ms));
const fmt=n=>n.toLocaleString('ja-JP');
const roundData={
  lanes:[[{n:'A',s:0}],[{n:'4',s:2}],[{n:'8',s:1}],[{n:'2',s:3}]],
  second:[{n:'3',s:0},{n:'7',s:1},{n:'6',s:2},{n:'5',s:3}],
  third:{n:'2',s:2},
  dealer:[{n:'9',s:0},{n:'8',s:2}]
};
const state={phase:'idle',round:1,balance:1000,selected:null,bet:50,drew:false,busy:false,counts:[0,0,0,0],dealerCount:0,revealed:0,generation:0};
function cardValue(n){return n==='A'?1:Number(n)}
function handScore(cards){return cards.reduce((sum,c)=>sum+cardValue(c.n),0)%10}
function createFace(card){const redClass=red(card.s)?' red':'';return `<div class="card-face${redClass}"><small>${card.n}</small>${suits[card.s]}</div>`}
function staticCard(card){const div=document.createElement('div');div.className='card';div.innerHTML=createFace(card);return div}
function backCard(){const div=document.createElement('div');div.className='card back';return div}
function flipCard(card,revealed=false){const div=document.createElement('div');div.className='flip-card'+(revealed?' revealed':'');div.innerHTML=`<div class="flip-inner"><div class="back"></div><div class="front${red(card.s)?' red':''}"><small>${card.n}</small>${suits[card.s]}</div></div>`;return div}
function laneCards(index){const cards=[];if(state.counts[index]>=1)cards.push(roundData.lanes[index][0]);if(state.counts[index]>=2)cards.push(roundData.second[index]);if(state.counts[index]>=3)cards.push(roundData.third);return cards}
function selectedScorePreview(){return state.selected==null?null:handScore(laneCards(state.selected))}
function renderDealer(){const dealer=$('#dealer');dealer.replaceChildren();for(let i=0;i<state.dealerCount;i++)dealer.append(flipCard(roundData.dealer[i],i<state.revealed));}
function renderLanes(){const laneRow=$('#laneRow');laneRow.innerHTML='';
 for(let i=0;i<4;i++){
   const lane=document.createElement('button');lane.className='lane';
   if(state.phase==='select')lane.classList.add('selectable'); else lane.classList.add('disabled');
   if(state.selected===i)lane.classList.add('active');
   lane.dataset.lane=i;
   const cards=laneCards(i);
   const score=(i===state.selected && cards.length>=2 && ['decide','draw3','reveal','result'].includes(state.phase))?handScore(cards):'';
   lane.innerHTML=`<label>場 ${i+1}</label><div class="cards"></div><div class="score">${score!==''?score+'点':''}</div>`;
   const cardsEl=lane.querySelector('.cards');
   cards.forEach(card=>cardsEl.append(staticCard(card)));
   if(state.phase==='select') lane.onclick=()=>{if(state.busy)return; state.selected=i; render();};
   laneRow.append(lane);
 }
}
function renderChips(){const wrap=$('#chips');wrap.innerHTML='';[10,50,100,500].forEach(n=>{const b=document.createElement('button');b.className='chip-btn'+(state.bet===n?' active':'');b.textContent=n;b.onclick=()=>{if(state.busy)return; state.bet=n; render();};wrap.append(b)});}
function setText(stage,statement,desc){$('#stage').textContent=stage;$('#statement').textContent=statement;$('#desc').textContent=desc}
function showActions(list){const wrap=$('#actions');wrap.innerHTML='';list.forEach(item=>{const b=document.createElement('button');b.className=item.kind;b.textContent=item.label;b.disabled=!!item.disabled;b.onclick=item.onClick;wrap.append(b);});}
function moveCoinToSelected(show=true){const coin=$('#coin');if(state.selected==null||!show){coin.style.opacity='0';return;} const lane=$$('.lane')[state.selected]; if(!lane)return; const play=$('#play').getBoundingClientRect(); const r=lane.getBoundingClientRect(); coin.style.left=((r.left-play.left)+r.width/2-18)+'px'; coin.style.bottom=(play.bottom-r.bottom+58)+'px'; coin.style.opacity='1';}
function render(){ $('#balance').textContent=fmt(state.balance); $('#round').textContent=`ROUND ${String(state.round).padStart(2,'0')}`; $('#pot').textContent=(state.phase==='bet'||state.phase==='deal2'||state.phase==='decide'||state.phase==='draw3'||state.phase==='reveal'||state.phase==='result')?state.bet:0; renderDealer(); renderLanes();
 const dealerScore=$('#dealerScore'), outcome=$('#boardOutcome'), boardMessage=$('#boardMessage');
 dealerScore.hidden=state.revealed===0; dealerScore.textContent=state.revealed?('親 '+handScore(roundData.dealer.slice(0,state.revealed))+'点'):'';
 outcome.hidden=state.phase!=='result';
 boardMessage.hidden=!['select','decide'].includes(state.phase);
 boardMessage.textContent=state.phase==='select'?'↓ 4枚から賭ける札をタップ':state.phase==='decide'?'自分の札の点数を確認して選択':'';
 if(state.phase==='result'){
  const a=handScore(laneCards(state.selected)), b=handScore(roundData.dealer), verdict=a===b?'引き分け':a>b?'あなたの勝ち！':'親の勝ち';
  outcome.innerHTML='<strong>'+verdict+'</strong><div class="score-line">あなた '+a+'点　対　親 '+b+'点</div><div class="result-sub">'+(a===b?'賭け点は返却':a>b?'+'+state.bet+' チップ':'−'+state.bet+' チップ')+'</div>';
 }
 $('#results').classList.add('hidden'); $('#chips').classList.add('hidden'); $('#hint').classList.add('hidden'); moveCoinToSelected(state.phase!=='idle'&&state.phase!=='deal1'&&state.phase!=='select'?true:false);
 switch(state.phase){
   case 'idle':
     setText('スタート','カードを配って開始します','山札から1枚ずつ配られます。配り終わると、賭けたい札を選べます。');
     showActions([{label:'カードを配る','kind':'primary',onClick:startRound}]);
     break;
   case 'deal1':
     setText('配札中','カードを配っています…','まず場に4枚、続いて親に1枚配ります。');
     showActions([{label:'配札中…','kind':'ghost-btn',disabled:true,onClick:()=>{}}]);
     break;
   case 'select':
     $('#hint').classList.remove('hidden');
     setText('札の選択',state.selected==null?'どの札に賭けますか？':`場 ${state.selected+1} に賭けますか？`,state.selected==null?'4枚の中から1枚タップしてください。':`選んだ札が浮き上がります。この札でよければ次へ進みます。`);
     showActions([{label:'この札で賭ける','kind':'primary',disabled:state.selected==null,onClick:()=>{state.phase='bet'; render();}}]);
     break;
   case 'bet':
     $('#chips').classList.remove('hidden'); renderChips();
     setText('BET',`${state.bet}チップを賭けます`,`チップを選んで確定すると、全ての場に2枚目を配ります。`);
     showActions([{label:`${state.bet}チップを賭ける`,kind:'primary',onClick:betAndDealSecond}]);
     break;
   case 'deal2':
     setText('追加配札中','2枚目を配っています…','場4か所と親にカードが追加されます。');
     showActions([{label:'配札中…','kind':'ghost-btn',disabled:true,onClick:()=>{}}]);
     break;
   case 'decide':
     const preview=selectedScorePreview();
     setText('追加判断','引きますか？','選択中の札に現在の点数を表示しています。');
     showActions([
       {label:'この点数で勝負','kind':'secondary',onClick:()=>revealDealer(false)},
       {label:'もう1枚引く','kind':'primary',onClick:()=>drawThird()}
     ]);
     break;
   case 'draw3':
     setText('ドロー中','カードを引いています…','選んだ札に3枚目を追加します。');
     showActions([{label:'ドロー中…','kind':'ghost-btn',disabled:true,onClick:()=>{}}]);
     break;
   case 'reveal':
     setText('公開中','親のカードを公開しています…','1枚ずつめくって結果を表示します。');
     showActions([{label:'公開中…','kind':'ghost-btn',disabled:true,onClick:()=>{}}]);
     break;
   case 'result':
     const playerCards=laneCards(state.selected); const player=handScore(playerCards); const dealer=handScore(roundData.dealer); const win=player>dealer; const tie=player===dealer; let title=tie?'引き分け':win?'あなたの勝ち！':'CPUの勝ち'; let color=tie?'#5b73a8':win?'#2b9f79':'#d76060';
     setText('結果','勝敗が決まりました','結果はテーブル上に表示しています。');
     const results=$('#results'); results.classList.add('hidden');
     showActions([{label:'次のラウンドへ','kind':'primary',onClick:resetRound}]);
     break;
 }
}
async function animateDealTo(targetEl,cardHtml,token){
 const from=$('#deck').getBoundingClientRect(),to=targetEl.getBoundingClientRect();
 const fly=document.createElement('div');fly.className='flying';fly.style.left=from.left+'px';fly.style.top=from.top+'px';fly.innerHTML=cardHtml;document.body.append(fly);
 await delay(25);if(token!==state.generation){fly.remove();return false}
 fly.style.left=(to.left+(to.width-49)/2)+'px';fly.style.top=to.top+'px';fly.style.transform='rotate(5deg)';
 await delay(420);fly.remove();return token===state.generation;
}
async function startRound(){if(state.busy)return;state.busy=true;const token=++state.generation;state.phase='deal1';state.selected=null;state.drew=false;state.counts=[0,0,0,0];state.dealerCount=0;state.revealed=0;render();await delay(120);
 for(let i=0;i<4;i++){if(!await animateDealTo($$('.lane .cards')[i],'<div class="card back"></div>',token))return;state.counts[i]=1;renderLanes();await delay(115)}
 if(!await animateDealTo($('#dealer'),'<div class="card back"></div>',token))return;state.dealerCount=1;renderDealer();await delay(200);if(token!==state.generation)return;state.phase='select';state.busy=false;render();}
async function betAndDealSecond(){if(state.busy||state.bet>state.balance)return;state.busy=true;const token=state.generation;state.phase='deal2';state.balance-=state.bet;render();await delay(150);
 for(let i=0;i<4;i++){if(!await animateDealTo($$('.lane .cards')[i],'<div class="card back"></div>',token))return;state.counts[i]=2;renderLanes();await delay(115)}
 if(!await animateDealTo($('#dealer'),'<div class="card back"></div>',token))return;state.dealerCount=2;renderDealer();await delay(200);if(token!==state.generation)return;state.phase='decide';state.busy=false;render();}
async function drawThird(){if(state.busy)return;state.busy=true;state.drew=true;const token=state.generation;state.phase='draw3';render();await delay(150);if(!await animateDealTo($$('.lane .cards')[state.selected],'<div class="card back"></div>',token))return;state.counts[state.selected]=3;renderLanes();await delay(350);if(token!==state.generation)return;state.busy=false;await revealDealer(true);}
async function revealDealer(withDraw){if(state.busy)return;state.busy=true;const token=state.generation;state.drew=withDraw;state.phase='reveal';state.revealed=0;render();await delay(300);
 for(let i=0;i<state.dealerCount;i++){if(token!==state.generation)return;const target=$$('#dealer .flip-card')[i];if(target)target.classList.add('revealed');await delay(680);if(token!==state.generation)return;state.revealed=i+1;}
 state.phase='result';state.busy=false;const a=handScore(laneCards(state.selected)),b=handScore(roundData.dealer);if(a>=b)state.balance+=a===b?state.bet:state.bet*2;render();}
function resetRound(){state.generation++;state.busy=false;state.phase='idle';state.selected=null;state.bet=50;state.drew=false;state.counts=[0,0,0,0];state.dealerCount=0;state.revealed=0;state.round++;render();}
$('#restart').onclick=()=>{state.generation++;state.phase='idle';state.round=1;state.balance=1000;state.selected=null;state.bet=50;state.drew=false;state.busy=false;state.counts=[0,0,0,0];state.dealerCount=0;state.revealed=0;render();};
render();
</script></body></html>
