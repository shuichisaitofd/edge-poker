<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f7fb"><title>POKER TABLE</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf1f7;color:#23314a;font-family:system-ui,-apple-system,sans-serif}button{font:inherit;font-weight:700;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.4}.app{max-width:650px;min-height:100dvh;margin:auto;background:#fafbfe;display:flex;flex-direction:column}.top{background:white;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e1e7f0}.top b{font-size:20px}.top span{color:#4675e6}.top small{color:#60718e}.main{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px}.status{display:flex;justify-content:space-between;font-size:13px}.status b{background:#e4edfc;border-radius:9px;padding:6px 10px}.table{background:#dce8fa;border:2px solid #bbcee9;box-shadow:inset 0 0 0 7px #e7eefc;border-radius:110px;min-height:420px;padding:24px 8px 20px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;gap:12px}.player{text-align:center}.avatar{margin:auto auto 4px;width:38px;height:38px;border-radius:50%;background:#6884b4;display:grid;place-items:center;color:white;font-size:13px;font-weight:bold}.you .avatar{background:#4675e6}.name{font-size:12px;font-weight:750}.stack{font-size:12px;color:#4b648c}.cards,.board{display:flex;justify-content:center;gap:5px;margin-top:7px}.card{position:relative;display:grid;place-items:center;width:50px;height:69px;background:white;border:1px solid #c9d4e6;border-radius:7px;box-shadow:0 3px 0 #b7c6dc;font-size:27px;font-weight:800}.red{color:#e34e66}.rank{position:absolute;left:5px;top:3px;font-size:15px}.back{border:4px solid #fff;background:repeating-linear-gradient(45deg,#5278df 0 7px,#7397ec 7px 9px)}.empty{background:#eef4fc;border:2px dashed #b3c7e5;box-shadow:none}.mid{text-align:center}.pot{background:white;border-radius:25px;padding:8px 18px;color:#4675e6;font-weight:800;display:inline-block;font-size:14px}.board .card{width:min(50px,15.3vw)}.message{background:white;border:1px solid #dee7f3;border-radius:13px;min-height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:5px;padding:10px}.message strong{font-size:15px}.message small{font-size:12px;color:#677891}.start,.controls button{height:56px;border-radius:12px;border:1px solid #d2def0;background:white;color:#304669}.start,.controls .call{background:#4675e6;color:white;border:0}.start{width:100%;font-size:16px}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.controls .raise{background:#e9f0ff;color:#3967d5}.bottom{display:flex;justify-content:space-between;align-items:center;color:#8190a7;font-size:11px}.reset{border:0;background:transparent;color:#5d76a3;text-decoration:underline;padding:10px}.hidden{display:none}.foot{font-size:11px;color:#8a98af;text-align:center;padding:12px}@media(min-width:520px){.main{padding:22px 30px}.table{min-height:490px}.card,.board .card{width:59px;height:81px}}@media(max-width:360px){.main{padding:10px}.card{width:44px;height:62px}.board .card{height:62px}.controls button{font-size:12px}}
</style><div class="app"><header class="top"><b>POKER<span> TABLE</span></b><small>CPUと1対1 / 無料</small></header><main class="main"><div class="status"><span id="round">テキサスホールデム</span><b id="phase">スタート待ち</b></div><div class="table"><div class="player"><div class="avatar">CPU</div><div class="name">CPU</div><div class="stack" id="cpuStack"></div><div class="cards" id="cpuCards"></div></div><div class="mid"><div class="pot" id="pot">POT 0</div><div class="board" id="board"></div></div><div class="player you"><div class="avatar">YOU</div><div class="name">あなた</div><div class="stack" id="myStack"></div><div class="cards" id="myCards"></div></div></div><div class="message" aria-live="polite"><strong id="message">CPUとポーカーで対戦</strong><small id="detail">スタートを押すとカードが配られます。</small></div><button class="start" id="start">ゲームをスタート</button><div class="controls hidden" id="controls"><button id="fold">フォールド</button><button class="call" id="call">チェック</button><button class="raise" id="raise">レイズ +40</button></div><div class="bottom"><span>実際のお金は使用しません</span><button class="reset" id="reset">最初から</button></div></main><div class="foot">スマホ・PC対応のブラウザゲーム</div></div><script>
(()=>{'use strict';const el=id=>document.getElementById(id),suits=['♠','♥','♦','♣'],symbols={11:'J',12:'Q',13:'K',14:'A'},stages=['プリフロップ','フロップ','ターン','リバー'],labels=['ハイカード','ワンペア','ツーペア','スリーカード','ストレート','フラッシュ','フルハウス','フォーカード','ストレートフラッシュ'];let deck=[],me=[],cpu=[],board=[],money=1000,enemy=1000,pot=0,street=0,hand=0,playing=false,ended=false,owed=0;
const card=c=>'<div class="card '+([1,2].includes(c.s)?'red':'')+'"><span class="rank">'+(symbols[c.r]||c.r)+'</span>'+suits[c.s]+'</div>',back=()=>'<div class="card back"></div>',message=(a,b)=>{el('message').textContent=a;el('detail').textContent=b||''};
function draw(){el('myStack').textContent=money+' チップ';el('cpuStack').textContent=enemy+' チップ';el('pot').textContent='POT '+pot;el('round').textContent=hand?'ハンド '+hand:'テキサスホールデム';el('phase').textContent=playing?stages[street]:ended?'対戦結果':'スタート待ち';el('myCards').innerHTML=me.length?me.map(card).join(''):back()+back();el('cpuCards').innerHTML=cpu.length&&ended?cpu.map(card).join(''):back()+back();el('board').innerHTML=board.map(card).join('')+Array.from({length:5-board.length},()=>'<div class="card empty"></div>').join('');el('start').classList.toggle('hidden',playing);el('controls').classList.toggle('hidden',!playing);el('start').textContent=hand?'次のハンドを開始':'ゲームをスタート';el('call').textContent=owed?'コール '+owed:'チェック';el('call').disabled=owed>money;el('raise').disabled=money<owed+40||enemy<40;el('fold').disabled=!playing}
function shuffle(){deck=[];for(let s=0;s<4;s++)for(let r=2;r<=14;r++)deck.push({r,s});for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}}const take=n=>deck.splice(0,n);
function compare(a,b){for(let i=0;i<Math.max(a.length,b.length);i++){let d=(a[i]||0)-(b[i]||0);if(d)return d}return 0}
function evaluate(cards){const ranks=cards.map(c=>c.r).sort((a,b)=>b-a),count={};ranks.forEach(r=>count[r]=(count[r]||0)+1);let groups=Object.entries(count).map(([r,n])=>[+r,n]).sort((a,b)=>b[1]-a[1]||b[0]-a[0]);let u=[...new Set(ranks)],straight=0;if(u.includes(14))u.push(1);for(let i=0;i<=u.length-5;i++)if(u[i]-u[i+4]===4){straight=u[i];break}let flush=cards.every(c=>c.s===cards[0].s),cat=0,k=[];if(flush&&straight){cat=8;k=[straight]}else if(groups[0][1]===4){cat=7;k=[groups[0][0],groups[1][0]]}else if(groups[0][1]===3&&groups[1][1]===2){cat=6;k=[groups[0][0],groups[1][0]]}else if(flush){cat=5;k=ranks}else if(straight){cat=4;k=[straight]}else if(groups[0][1]===3){cat=3;k=[groups[0][0],...groups.slice(1).map(g=>g[0])]}else if(groups[0][1]===2&&groups[1][1]===2){cat=2;k=[Math.max(groups[0][0],groups[1][0]),Math.min(groups[0][0],groups[1][0]),groups[2][0]]}else if(groups[0][1]===2){cat=1;k=[groups[0][0],...groups.slice(1).map(g=>g[0])]}else{k=ranks}return [cat,...k]}
function best(cards){let ans=null;for(let a=0;a<7;a++)for(let b=a+1;b<7;b++)for(let c=b+1;c<7;c++)for(let d=c+1;d<7;d++)for(let e=d+1;e<7;e++){let rank=evaluate([cards[a],cards[b],cards[c],cards[d],cards[e]]);if(!ans||compare(rank,ans)>0)ans=rank}return ans}
function finish(who,info){playing=false;ended=true;owed=0;if(who===0){let half=Math.floor(pot/2);money+=half;enemy+=pot-half;message('引き分け',info)}else if(who===1){money+=pot;message('あなたの勝ち！',info)}else{enemy+=pot;message('CPUの勝ち',info)}pot=0;draw()}
function showdown(){while(board.length<5)board.push(...take(1));let a=best([...me,...board]),b=best([...cpu,...board]),c=compare(a,b);finish(c===0?0:c>0?1:-1,'あなた：'+labels[a[0]]+' ／ CPU：'+labels[b[0]])}
function advance(){if(street===3){showdown();return}street++;board.push(...take(street===1?3:1));owed=0;message(stages[street]+'：あなたの番です','チェックまたはレイズを選んでください。');draw()}
function start(){if(playing)return;if(money<20||enemy<20){money=1000;enemy=1000;hand=0}hand++;shuffle();me=take(2);cpu=take(2);board=[];street=0;pot=20;money-=10;enemy-=10;playing=true;ended=false;owed=0;message('あなたの番です','チェックで次へ、レイズで賭けます。');draw()}
function act(type){if(!playing)return;if(type==='fold'){finish(-1,'フォールドしました。');return}if(type==='raise'){if(money<owed+40||enemy<40)return;let amount=owed+40;money-=amount;pot+=amount;owed=0;let strong=cpu[0].r===cpu[1].r||cpu.some(c=>c.r>=12);if(Math.random()<(strong?.87:.63)){enemy-=40;pot+=40;advance()}else finish(1,'CPUがフォールドしました。')}else{if(owed){money-=owed;pot+=owed;owed=0;advance();return}if(street<3&&money>=40&&enemy>=40&&Math.random()<.16){enemy-=40;pot+=40;owed=40;message('CPUが40レイズしました','コール・レイズ・フォールドを選んでください。');draw()}else advance()}}
el('start').addEventListener('click',start);el('fold').addEventListener('click',()=>act('fold'));el('call').addEventListener('click',()=>act('call'));el('raise').addEventListener('click',()=>act('raise'));el('reset').addEventListener('click',()=>{money=1000;enemy=1000;pot=0;street=0;hand=0;playing=false;ended=false;owed=0;me=[];cpu=[];board=[];message('CPUとポーカーで対戦','スタートを押すとカードが配られます。');draw()});draw()})();
</script></html>
