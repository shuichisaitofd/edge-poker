<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a2118">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>旅館カブ</title>
<link rel="preload" as="image" href="assets/bg.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Shippori+Mincho+B1:wght@600;800&display=swap">
<script>if(/[?&](seed|test)=/.test(location.search)&&!/[?&]title=1/.test(location.search))document.documentElement.classList.add("skip-title")</script>
<link rel="preload" as="image" href="assets/title.webp">
<link rel="prefetch" as="image" href="assets/yakimanju.webp">
<link rel="prefetch" as="image" href="assets/clear.webp">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="app" id="app">
  <div class="field" id="field" data-stage="idle">

    <div class="topbar">
      <button class="tag score-tag" id="scoreBtn" type="button" aria-label="戦績を見る">SCORE <b id="scoreVal">0</b></button>
      <button class="sound" id="sound" type="button" aria-label="効果音 オン/オフ" aria-pressed="false"></button>
    </div>

    <div class="sp1"></div>

    <section class="zone zone-dealer" aria-label="あき(親)">
      <span class="tag tag-dealer" id="bossTag">あき</span>
      <div class="dealer-hand" id="dealerHand"></div>
      <span class="tag tag-score off" id="dealerScore"></span>
      <button class="deck" id="deck" type="button" aria-label="山札をタップして配る">
        <span class="deck-stack"></span>
        <span class="tag tag-deck" id="deckTag">残り 40枚</span>
      </button>
    </section>

    <section class="zone zone-mid" aria-live="polite">
      <div class="start-hint" id="startHint">画面をタップで配る</div>
      <div class="verdict off" id="verdict">
        <strong id="verdictTitle"></strong>
        <span id="verdictSub"></span>
      </div>
    </section>

    <section class="zone zone-lanes" id="lanes" aria-label="場札"></section>

    <div class="sp2"></div>

    <section class="zone zone-bank">
      <div class="purse" id="purse">持ち金 <strong id="purseAmount">1,000</strong>円</div>
    </section>

    <section class="zone zone-coins" id="coins" aria-label="賭け金の硬貨"></section>

    <section class="zone zone-slot">
      <div class="slot" id="slot" data-mode="none">
        <button class="slot-btn" id="slotBtn" type="button" disabled></button>
        <div class="slot-pair" id="slotPair">
          <button class="slot-btn slot-main" id="standBtn" type="button">この点数で勝負</button>
          <button class="slot-btn slot-sub" id="hitBtn" type="button">もう1枚引く</button>
        </div>
      </div>
    </section>

    <div class="omen" id="omen" aria-hidden="true"><span class="omen-l"></span><span class="omen-r"></span><span class="omen-c"></span></div>
    <div class="jackpot" id="jackpot" aria-hidden="true">
      <div class="jp-rays"></div>
      <p class="jp-top">激アツ</p>
      <div class="jp-reels"><span class="reel">9</span><span class="reel">9</span><span class="reel">9</span></div>
      <p class="jp-main">カブ！！</p>
      <p class="jp-sub">大 当 た り</p>
    </div>
    <div class="cutin" id="cutin" data-kind="win" aria-hidden="true"><div class="cutin-lines"></div><div class="cutin-band"><span id="cutinText"></span><small id="cutinSub"></small></div></div>
    <div class="stats" id="stats" hidden>
      <div class="stats-sheet" role="dialog" aria-label="戦績">
        <h2>戦績</h2>
        <dl id="statsList"></dl>
        <button type="button" class="stats-close" id="statsClose">とじる</button>
      </div>
    </div>
  </div>

  <!-- スタート画面 → ロード(あらすじ)画面 -->
  <div class="title" id="title" data-phase="start">
    <div class="title-shade"></div>
    <div class="title-head">
      <p class="title-kicker">ガソスタの忘れもの</p>
      <h1 class="title-logo">旅館カブ</h1>
    </div>
    <button class="title-btn" id="titleBtn" type="button">あきから4000円を奪う</button>
    <div class="loading" id="loading" aria-live="polite">
      <p class="load-main">あきがガソスタに忘れた<br><em>4000円</em>を奪え</p>
      <ol class="load-lines" id="loadLines">
        <li>場の札を1枚選んで、金額を賭ける</li>
        <li>あきより点が高ければ勝ち</li>
        <li>あきの持ち金を<b>0</b>にすればクリア</li>
        <li>持ち金は1,000円。尽きたら負け</li>
      </ol>
      <div class="load-bar"><i id="loadBar"></i></div>
      <p class="load-tap">タップでスキップ</p>
    </div>
  </div>

  <!-- BAD END(持ち金が尽きた翌日)/ GOOD END(あきを倒した翌日) -->
  <div class="badend" id="badend" data-kind="bad" hidden aria-live="polite">
    <p class="be-day" id="beDay">次の日</p>
    <figure class="be-scene" id="beScene">
      <img id="beImg" src="assets/yakimanju.webp" alt="群馬の焼きまんじゅう" draggable="false">
      <figcaption id="beCap">この群馬の焼きまんじゅうを<br>あきに奢ってもらった。</figcaption>
    </figure>
    <p class="be-stamp" id="beStamp">BAD END</p>
    <button class="title-btn be-btn" id="beBtn" type="button">もう一度あきに挑む</button>
  </div>
</main>
<noscript><p style="color:#fff;text-align:center">JavaScriptを有効にしてください。</p></noscript>
<script src="js/rules.js"></script>
<script src="js/cards.js"></script>
<script src="js/audio.js"></script>
<script src="js/fx.js"></script>
<script src="js/game.js"></script>
<script src="js/title.js"></script>
</body>
</html>
