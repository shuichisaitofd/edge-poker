0b06b5;width:100%;max-width:370px}.result-panel strong{display:block;font-size:32px;color:#783826}.result-panel p{font-weight:900}.result-panel button{background:#ac8350;color:#fff;border:0;border-radius:8px;padding:13px 22px;font-weight:1000}.cutin{position:absolute;inset:0;pointer-events:none;z-index:25;display:grid;place-items:center;overflow:hidden}.cutin span{display:block;opacity:0;background:#1c1614e6;color:#f7e1ac;padding:14px 42px;transform:rotate(-10deg);font-weight:1000;font-size:46px;text-shadow:3px 3px #6a2819}.cutin.on span{animation:swoop .95s both}@keyframes swoop{0%{transform:translateX(150%) rotate(-10deg);opacity:0}20%,75%{opacity:1;transform:translateX(0) rotate(-10deg)}100%{opacity:0;transform:translateX(-130%) rotate(-10deg)}}.flying{position:fixed;z-index:50;pointer-events:none;transition:left .34s ease,top .34s ease,transform .34s ease}.reset{position:absolute;bottom:3%;right:10%;z-index:18;border:0;background:#ead7b9ab;border-radius:5px;padding:5px 8px;font-size:11px}.hidden{display:none!important}.caption{position:absolute;bottom:3%;left:11%;font-size:10px;color:#392a1a;background:#eee0c088;padding:3px 6px;border-radius:3px}@media(max-height:710px){.dealer{top:16%}.stamp{top:12%}.lanes{top:34%}.controls{bottom:9%}}@media(max-width:370px){.field{left:6%;right:6%}.lanes{left:7%;right:7%}.card,.back,.flip{width:44px;height:63px}.controls{left:9%;right:9%}}
</style></head><body><div class="app"><div class="photo"></div><div class="field"></div><div class="top"><div class="brand">旅館カブ</div><div class="bank">持ち金 <strong id="balance">1,000</strong> 円</div></div><div class="stamp">親</div><div class="dealer" id="dealer"></div><div class="dscore hidden" id="dealerScore"></div><button class="deck start" id="deck" aria-label="山札をタップして開始"><div class="back"></div><span id="deckLabel">山札をタップ</span></button><div class="lanes" id="lanes"></div><div class="controls"><div class="prompt hidden" id="prompt"></div><div class="money hidden" id="money"></div><button class="action hidden" id="betButton"></button><div class="decisions hidden" id="decisions"><button class="action" id="stand">この点数で勝負</button><button class="action" id="hit">もう1枚引く</button></div></div><div class="cutin" id="cutin"><span id="cutinText">勝負！</span></div><div class="result hidden" id="result"><div class="result-panel"><strong id="resultTitle">勝ち！</strong><p id="resultText"></p><p id="resultMoney"></p><button id="next">もう一勝負</button></div></div><div class="caption" id="status">山札をタップして始める</div><button class="reset" id="reset">リセット</button></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),ranks=['♠','♥','♦','♣'],pause=t=>new Promise(r=>setTimeout(r,t));let seq=0,stage='idle',lock=false,deck=[],lanes=[[],[],[],[]],dealer=[],picked=-1,bet=0,stake=0,coins=1000,reveal=0,round=1;const amounts=[5,10,100,500];const label=c=>c.n===1?'A':c.n;function sum(cards){return cards.reduce((a,c)=>a+c.n,0)%10}function role(cs,parent=false){const ns=cs.map(c=>c.n);if(cs.length===2&&parent&&ns.includes(1)&&ns.includes(9))return {type:'kuppin',name:'クッピン',mult:1};if(cs.length===2&&!parent&&ns.includes(1)&&ns.includes(4))return {type:'mippin',name:'ミッピン',mult:3};if(cs.length===3){if(ns.every(x=>x===ns[0]))return {type:'arashi',name:'嵐',mult:[1,3,5,10].includes(ns[0])?10:5};const a=[...cs].sort((x,y)=>x.n-y.n);if(a.every(x=>x.s===a[0].s)&&a[0].n+1===a[1].n&&a[1].n+1===a[2].n)return {type:'shuntsu',name:'順子',mult:5}}return {type:'normal',name:sum(cs)+'点',mult:1}}
function mix(){deck=[];for(let s=0;s<4;s++)for(let n=1;n<=10;n++)deck.push({n,s});for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}}function card(c){const e=document.createElement('div');e.className='card'+([1,2].includes(c.s)?' red':'');e.innerHTML='<small>'+label(c)+'</small>'+ranks[c.s];return e}function back(){const e=document.createElement('div');e.className='back';return e}function flip(c,open){const a=document.createElement('div');a.className='flip'+(open?' is-open':'');const i=document.createElement('div');i.className='flip-inner';const b=back();b.className+=' rear';const f=card(c);f.className+=' front';i.append(b,f);a.append(i);return a}function say(t){$('status').textContent=t}function burst(t){$('cutinText').textContent=t;$('cutin').classList.remove('on');void $('cutin').offsetWidth;$('cutin').classList.add('on')}
function drawUI(){ $('balance').textContent=coins.toLocaleString();$('dealer').replaceChildren(...dealer.map((c,i)=>flip(c,i<reveal)));$('dealerScore').classList.toggle('hidden',!reveal);if(reveal)$('dealerScore').textContent='親 '+sum(dealer.slice(0,reveal))+' 点';$('lanes').replaceChildren();lanes.forEach((cs,i)=>{const b=document.createElement('button');b.className='lane'+(picked===i?' selected':'')+(['pick','bet'].includes(stage)?' selectable':'');b.disabled=lock||!['pick','bet'].includes(stage);b.innerHTML='<span class="name">場 '+(i+1)+'</span><span class="cards"></span>';cs.forEach(c=>b.querySelector('.cards').append(card(c)));if(i===picked&&cs.length>1){const x=document.createElement('span');x.className='score';x.textContent=sum(cs)+'点';b.append(x)}if(i===picked&&(bet||stake)){const x=document.createElement('span');x.className='wager';x.textContent=(stake||bet)+'円';b.append(x)}b.onclick=()=>choose(i);$('lanes').append(b)});$('deck').disabled=lock||stage!=='idle';$('deck').classList.toggle('start',stage==='idle');$('deckLabel').textContent=stage==='idle'?'タップして配る':'山札';$('money').classList.toggle('hidden',stage!=='bet');$('betButton').classList.toggle('hidden',stage!=='bet');$('decisions').classList.toggle('hidden',stage!=='decide');$('prompt').classList.toggle('hidden',stage!=='pick');$('prompt').textContent='賭ける札をタップ';if(stage==='bet'){$('betButton').textContent=bet?'BET '+bet+'円を確定':'金額を選んでください';$('betButton').disabled=!bet||lock;$('betButton').classList.toggle('ready',!!bet);$('money').replaceChildren();for(const a of amounts){const b=document.createElement('button');b.dataset.n=a;b.textContent=a+'円';b.disabled=a>coins;b.className=a===bet?'selected':'';b.onclick=()=>{bet=a;say('BET '+a+'円を確定できます');drawUI()};$('money').append(b)}}}
function point(e){const a=e.getBoundingClientRect();return{x:a.left+a.width/2,y:a.top+a.height/2}}async function deliver(target){const c=deck.pop(),src=point($('deck')),dst=point(target),f=back();f.classList.add('flying');f.style.left=src.x-24+'px';f.style.top=src.y-34+'px';document.body.append(f);await pause(25);f.style.left=dst.x-24+'px';f.style.top=dst.y-34+'px';f.style.transform='rotate(7deg)';await pause(350);f.remove();return c}async function giveLane(i){const target=$('lanes').children[i].querySelector('.cards');const c=await deliver(target);lanes[i].push(c);drawUI();await pause(90)}async function giveDealer(){const c=await deliver($('dealer'));dealer.push(c);drawUI();await pause(90)}async function start(){if(stage!=='idle'||lock)return;const id=++seq;lock=true;stage='deal';lanes=[[],[],[],[]];dealer=[];picked=-1;bet=0;stake=0;reveal=0;mix();drawUI();say('配札中');for(let i=0;i<4;i++){await giveLane(i);if(id!==seq)return}await giveDealer();if(id!==seq)return;lock=false;stage='pick';drawUI();say('賭ける場を選択')}
function choose(i){if(lock||!['pick','bet'].includes(stage))return;if(stage==='pick'){picked=i;stage='bet';bet=0}else if(picked===i){picked=-1;bet=0;stage='pick'}else{picked=i}drawUI();say(stage==='bet'?'硬貨を選択。場札は変更できます':'場札を選択')}async function confirm(){if(stage!=='bet'||!bet||lock)return;const id=seq;lock=true;stake=bet;bet=0;coins-=stake;stage='deal2';drawUI();say('追加配札中');for(let i=0;i<4;i++){await giveLane(i);if(id!==seq)return}await giveDealer();if(id!==seq)return;lock=false;stage='decide';drawUI();say('引くか、勝負かを選択')}
async function resolve(hit){if(stage!=='decide'||lock)return;const id=seq;lock=true;stage='resolve';drawUI();burst(hit?'もう一枚！':'勝負！');if(hit){say('追加の札を配っています');await giveLane(picked)}if(id!==seq)return;const d0=role(dealer,true);if(d0.type!=='kuppin'&&sum(dealer)<=5&&dealer.length<3)await giveDealer();if(id!==seq)return;say('親が一枚ずつ公開');for(let i=0;i<dealer.length;i++){reveal=i+1;drawUI();await pause(670);if(id!==seq)return}const p=role(lanes[picked],false),d=role(dealer,true),ps=sum(lanes[picked]),ds=sum(dealer);let win=false,tie=false;if(d.type==='kuppin')win=false;else if(['mippin','arashi','shuntsu'].includes(p.type))win=true;else if(['arashi','shuntsu'].includes(d.type))win=false;else if(ps===ds)tie=true;else win=ps>ds;const gain=win?stake*p.mult:0;coins+=win?stake+gain:tie?stake:0;burst(win?'大勝負！':tie?'引き分け':'負けた！');$('resultTitle').textContent=win?'勝った！':tie?'引き分け':'負けた！';$('resultText').textContent='あなた '+ps+'点（'+p.name+'） / 親 '+ds+'点（'+d.name+'）';$('resultMoney').textContent=win?'＋'+gain+'円':tie?'賭け金を返却':'−'+stake+'円';stage='result';lock=false;drawUI();say('勝負終了');await pause(460);if(stage==='result')$('result').classList.remove('hidden')}
function next(){if(stage!=='result')return;round++;stage='idle';lock=false;picked=-1;bet=0;stake=0;reveal=0;lanes=[[],[],[],[]];dealer=[];if(coins<5)coins=1000;$('result').classList.add('hidden');drawUI();say('山札をタップして開始')}function reset(){seq++;stage='idle';lock=false;coins=1000;round=1;picked=-1;bet=0;stake=0;reveal=0;lanes=[[],[],[],[]];dealer=[];document.querySelectorAll('.flying').forEach(x=>x.remove());$('result').classList.add('hidden');drawUI();say('山札をタップして開始')}
$('deck').onclick=start;$('betButton').onclick=confirm;$('stand').onclick=()=>resolve(false);$('hit').onclick=()=>resolve(true);$('next').onclick=next;$('reset').onclick=reset;reset();})();
</script></body></html>
